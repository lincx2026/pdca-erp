worker_processes auto;
pid /tmp/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
              application/xml text/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # ===== HTTP → HTTPS 跳转 =====
    server {
        listen      80;
        server_name ${ERP_DOMAIN} localhost;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }
        location / {
            return 301 https://${ERP_DOMAIN}$request_uri;
        }
    }

    # ===== HTTPS 主服务 =====
    server {
        listen      443 ssl http2;
        server_name ${ERP_DOMAIN};
        charset utf-8;

        # SSL 证书
        ssl_certificate      /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key  /etc/nginx/ssl/private.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # HSTS (可选, 首次 HTTPS 生效后告诉浏览器只走 HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ===== 前端 SPA =====
        root   /usr/share/nginx/html;
        index  index.html;

        # 静态资源强缓存 (Vite 带 hash)
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        # ===== 后端 API: /api/** → http://backend:8080/** =====
        location ^~ /api/ {
            proxy_pass         http://backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       off;
            client_body_timeout   60s;
        }

        # ===== WebSocket: /ws/** → http://backend:8080/ws/** (保持 /ws 前缀) =====
        location ^~ /ws/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            # WebSocket 长连接需要更长超时 (默认 65s 会切断空闲连接)
            proxy_connect_timeout 30s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
            proxy_buffering       off;
        }

        # Knife4j 文档穿透
        location = /doc.html {
            proxy_pass         http://backend:8080/doc.html;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
        location /v3/ {
            proxy_pass         http://backend:8080/v3/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        }
        location /webjars/ {
            proxy_pass         http://backend:8080/webjars/;
            proxy_set_header   Host               $host;
        }
        location /favicon.ico {
            alias  /usr/share/nginx/html/favicon.ico;
            access_log off;
            expires 7d;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache";
        }
    }
}
