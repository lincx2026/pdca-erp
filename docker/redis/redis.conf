# Redis 配置
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
tcp-backlog 511

loglevel notice
databases 16

save 900 1
save 300 10
save 60 10000

rdbcompression yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory 512mb
maxmemory-policy noeviction
