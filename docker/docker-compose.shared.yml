# Linux ECS with an existing PostgreSQL server and host Nginx. Compose >= 2.24.4.
services:
  postgres:
    profiles: [managed-postgres]
  redis:
    image: ${ERP_REDIS_IMAGE:-redis:7.2.4-alpine}
    ports: !override
      - "127.0.0.1:${ERP_REDIS_PORT:-16379}:6379"
  backend:
    depends_on: !reset {}
    ports: !reset []
    networks: !reset []
    network_mode: host
    mem_limit: ${ERP_BACKEND_MEMORY_LIMIT:-3g}
    environment:
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${ERP_REDIS_PORT:-16379}
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: ${BACKEND_PORT:-18081}
    healthcheck:
      test: [CMD-SHELL, 'curl --noproxy "*" -fsS http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness >/dev/null']
  frontend:
    ports: !reset []
    networks: !reset []
    network_mode: host
    environment:
      ERP_HTTP_PORT: ${ERP_HTTP_PORT:-18080}
      BACKEND_PORT: ${BACKEND_PORT:-18081}
      NGINX_ENVSUBST_FILTER: ^(ERP_DOMAIN|ERP_HTTP_PORT|BACKEND_PORT)$
    volumes: !override
      - ./nginx/nginx.shared.conf:/etc/nginx/templates/nginx.conf.template:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -Y off -qO- http://127.0.0.1:$${ERP_HTTP_PORT}/healthz >/dev/null']
